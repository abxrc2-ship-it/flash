name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | sed -nE 's/.*version "([0-9]+).*/\1/p' | head -n 1)
          if [ -z "$JAVA_MAJOR" ]; then
            JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | head -n 1 | cut -d. -f1)
          fi
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ] || ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "Error: Failed to detect Java major version."
            exit 1
          fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Active Java major version ($JAVA_MAJOR) is lower than 17."
            exit 1
          fi
          echo "Java major version $JAVA_MAJOR is valid (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "Debug keystore already exists."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to find or create ./debug.keystore"
            exit 1
          fi
          echo "Temporary debug keystore verified."

          # Ensure Android SDK licenses are accepted if sdkmanager is available
          if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME" ]; then
            mkdir -p "$ANDROID_HOME/licenses" 2>/dev/null || true
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "Expected debug APK '$TARGET_APK' does not exist."
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered files in app/build/outputs/apk:"
              find app/build/outputs/apk -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            echo "Error: Expected debug APK not found at $TARGET_APK."
            exit 1
          fi

          if [ ! -s "$TARGET_APK" ]; then
            echo "Error: APK file '$TARGET_APK' is empty."
            exit 1
          fi

          case "$TARGET_APK" in
            *.apk) ;;
            *) echo "Error: '$TARGET_APK' does not have .apk extension."; exit 1 ;;
          esac

          if [ "$TARGET_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: Selected APK is not exactly app/build/outputs/apk/debug/app-debug.apk."
            exit 1
          fi

          echo "Debug APK verified successfully: $TARGET_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          CLEAN_REPO_NAME=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_-]/-/g' | sed 's/-\{2,\}/-/g' | sed 's/^-//;s/-$//')
          if [ -z "$CLEAN_REPO_NAME" ]; then
            CLEAN_REPO_NAME="android-app"
          fi
          RELEASE_FILENAME="${CLEAN_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          TMP_DIR="${RUNNER_TEMP:-/tmp}/release-asset"
          mkdir -p "$TMP_DIR"
          RELEASE_ASSET_PATH="$TMP_DIR/$RELEASE_FILENAME"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$RELEASE_ASSET_PATH"

          echo "asset_path=$RELEASE_ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$RELEASE_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version

          ASSET_PATH="${{ steps.prepare_release.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_release.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ]; then
            echo "Error: Release asset does not exist at $ASSET_PATH"
            exit 1
          fi

          if [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset is empty at $ASSET_PATH"
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *) echo "Error: Release asset is not an APK."; exit 1 ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES_FILE="${RUNNER_TEMP:-/tmp}/release_notes.md"
          {
            echo "### Automated Debug APK Build"
            echo ""
            echo "This is an automatically generated debug APK."
            echo "The APK was built by GitHub Actions."
            echo ""
            echo "- **Run Number:** ${GITHUB_RUN_NUMBER}"
            echo "- **Run Attempt:** ${GITHUB_RUN_ATTEMPT}"
            echo "- **Commit SHA:** ${GITHUB_SHA}"
            echo ""
            echo "> **Note:** This APK is intended for testing purposes and is signed only with a temporary debug keystore. It is not a Play Store production release."
          } > "$NOTES_FILE"

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --target "$GITHUB_SHA" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          ASSET_NAME="${{ steps.prepare_release.outputs.asset_name }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "GitHub Release publishing succeeded!"
            gh release view "$RELEASE_TAG"
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url 2>/dev/null || echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}")

            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${GITHUB_RUN_NUMBER}"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"

            {
              echo "### :white_check_mark: Debug APK Build & Release Succeeded"
              echo ""
              echo "- **Release Tag:** \`$RELEASE_TAG\`"
              echo "- **APK Filename:** \`$ASSET_NAME\`"
              echo "- **GitHub Release Page:** [$RELEASE_URL]($RELEASE_URL)"
              echo ""
              echo "You can download the APK directly on your phone from the release **Assets** section at the link above."
              echo "The standard GitHub Actions artifact named \`app-debug-apk\` is also available as a backup under this workflow run's Artifacts."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.publish_release.outcome }}" = "failure" ]; then
            echo "::warning::GitHub Release publishing did not succeed. (Outcome: ${{ steps.publish_release.outcome }})"
            echo "The debug APK build and artifact upload completed successfully."
            echo "The debug APK artifact named 'app-debug-apk' remains available for download."

            {
              echo "### :warning: APK Built Successfully (Release Publishing Failed)"
              echo ""
              echo "The debug APK was built successfully and preserved as a GitHub Actions artifact, but publishing to GitHub Releases encountered an issue."
              echo ""
              echo "You can download the APK directly from the **Artifacts** section of this workflow run: \`app-debug-apk\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Build did not complete. Release step was not executed. (Outcome: ${{ steps.publish_release.outcome }})"
            {
              echo "### :x: Debug APK Build Failed"
              echo ""
              echo "The debug APK build did not complete successfully. Check the step logs above to view the exact error."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
